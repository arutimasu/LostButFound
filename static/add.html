ymaps.ready(function () {
    var map;
    ymaps.geolocation.get().then(function (res) {
        var mapContainer = $('#map'),
            bounds = res.geoObjects.get(0).properties.get('boundedBy'),
            // Рассчитываем видимую область для текущей положения пользователя.
            mapState = ymaps.util.bounds.getCenterAndZoom(
                bounds,
                [mapContainer.width(), mapContainer.height()]
            );
        createMap(mapState);
    }, function (e) {
        // Если местоположение невозможно получить, то просто создаем карту.
        createMap({
            center: [55.751574, 37.573856],
            zoom: 2
        });
    });
    
    function createMap (state) {
        map = new ymaps.Map('map', state);
        map.events.add('click', function (e) {
        if (!map.balloon.isOpen()) {
            coords = e.get('coords');
            document.forms["add"].getElementsByTagName("input")[4].value = coords[0].toPrecision(6)
            document.forms["add"].getElementsByTagName("input")[5].value = coords[1].toPrecision(6)
            map.balloon.open(coords, {
                contentHeader:'Событие!',
                contentBody:'<p>Кто-то щелкнул по карте.</p>' +
                    '<p>Координаты щелчка: ' + [
                    coords[0].toPrecision(6),
                    coords[1].toPrecision(6)
                    ].join(', ') + '</p>',
                contentFooter:'<sup>Щелкните еще раз</sup>'
            });
            
        }

        else {
            map.balloon.close();
        }
    });

    // Обработка события, возникающего при щелчке
    // правой кнопки мыши в любой точке карты.
    // При возникновении такого события покажем всплывающую подсказку
    // в точке щелчка.
    map.events.add('contextmenu', function (e) {
        map.hint.show(e.get('coords'), 'Кто-то щелкнул правой кнопкой');
    });
      // Hiding the hint when opening the balloon.
    map.events.add('balloonopen', function (e) {
        map.hint.close();
    });
    }
});
  
  
</script>
